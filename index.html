<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenkins Genesis of Ocala — Accessory &amp; Protection Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161412; --panel:#1b1916; --ink:#ece7de; --gold:#B08D57; --gold-lt:#c49e66;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
input,select,button{font-family:inherit;color:inherit;outline:none}
input::placeholder{color:rgba(236,231,222,.3)}
.wrap{max-width:1280px;width:100%;margin:0 auto;padding:0 48px}
.shell{min-height:100vh;display:flex;flex-direction:column}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 0 22px}
.brand{display:flex;align-items:center;gap:14px}
.logo-img{height:62px;display:block;margin-left:-2px}
.brand-name{font-family:var(--serif);font-size:23px;letter-spacing:.06em;line-height:1}
.brand-sub{font-size:9.5px;letter-spacing:.3em;color:rgba(236,231,222,.5);margin-top:6px}
.hdr-right{display:flex;align-items:flex-end;gap:36px}
.total-big{font-family:var(--serif);font-size:36px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.total-cap{font-size:10px;letter-spacing:.26em;color:rgba(236,231,222,.45);margin-top:6px;text-align:right}
.btn-ghost{font-size:10px;letter-spacing:.2em;color:rgba(236,231,222,.5);border:1px solid rgba(255,255,255,.18);
  padding:9px 14px;cursor:pointer;margin-bottom:2px;background:none}
.btn-ghost:hover{color:var(--gold);border-color:var(--gold)}

/* step nav */
.nav{border-bottom:1px solid rgba(176,141,87,.35)}
.nav-in{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px}
.steps{display:flex;gap:36px;font-size:11px;letter-spacing:.22em}
.step{cursor:pointer;color:rgba(236,231,222,.4);background:none;border:none;padding:0 0 2px;letter-spacing:.22em;font-size:11px}
.step:hover{color:var(--gold)}
.step.on{color:var(--gold)}
.veh-line{font-size:11px;letter-spacing:.18em;color:rgba(236,231,222,.5)}

/* generic */
h2.title{font-family:var(--serif);font-size:30px;font-style:italic;font-weight:400;margin:0}
.sub{font-size:12.5px;color:rgba(236,231,222,.5);margin-top:6px}
.pane{padding:36px 0 60px}
.cap{font-size:10px;letter-spacing:.24em;color:rgba(236,231,222,.5)}
.field{display:flex;flex-direction:column;gap:10px}
.field input,.field select{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.22);
  font-size:16px;padding:8px 0;border-radius:0}
.field select{background:var(--bg);appearance:none}
.field input:focus,.field select:focus{border-bottom:1px solid var(--gold)}
.btn-gold{font-size:11px;letter-spacing:.22em;color:#161412;background:var(--gold);padding:14px 30px;
  font-weight:600;cursor:pointer;border:none}
.btn-gold:hover{background:var(--gold-lt)}
.btn-back{font-size:11px;letter-spacing:.2em;color:rgba(236,231,222,.5);cursor:pointer;background:none;border:none;padding:0}
.btn-back:hover{color:var(--gold)}
.row-end{display:flex;justify-content:space-between;align-items:center;margin-top:36px}

/* products */
.filters{display:flex;gap:28px}
.filt{font-size:11px;letter-spacing:.18em;cursor:pointer;padding-bottom:6px;background:none;border:none;
  color:rgba(236,231,222,.4);border-bottom:1px solid transparent}
.filt:hover{color:var(--gold)}
.filt.on{color:var(--ink);border-bottom:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);margin-top:28px}
.card{background:var(--bg);padding:26px 28px 24px;position:relative;cursor:pointer}
.card:hover{background:#1b1916}
.chk{position:absolute;top:22px;right:24px;width:20px;height:20px;border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#161412}
.chk.on{border-color:var(--gold);background:var(--gold)}
.brandtag{font-size:10px;letter-spacing:.24em;color:rgba(236,231,222,.55)}
.brandtag.xpel{color:var(--gold)}
.pname{font-size:16px;font-weight:500;margin-top:11px;line-height:1.35;padding-right:34px;min-height:44px}
.pdesc{font-size:12px;color:rgba(236,231,222,.5);margin-top:7px;line-height:1.5;min-height:36px}
.pricerow{display:flex;align-items:baseline;gap:4px;margin-top:14px}
.dollar{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--gold)}
.pinput{font-family:var(--serif);font-size:28px;background:transparent;border:none;
  border-bottom:1px solid transparent;padding:0;width:120px;font-variant-numeric:tabular-nums}
.pinput:hover{border-bottom:1px solid rgba(255,255,255,.3)}
.pinput:focus{border-bottom:1px solid var(--gold)}
.warr{font-size:9px;letter-spacing:.14em;color:rgba(236,231,222,.35);margin-top:6px;text-transform:uppercase}
.chips{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:9px;letter-spacing:.14em;padding:5px 9px;cursor:pointer;background:none;
  border:1px solid rgba(255,255,255,.15);color:rgba(236,231,222,.35)}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);background:rgba(176,141,87,.14);color:var(--gold)}

/* custom rows */
.custom-hd{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid rgba(176,141,87,.35);padding-bottom:10px;margin-top:36px}
.crow{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cbox{width:20px;height:20px;flex:none;cursor:pointer;border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#161412}
.cbox.on{border-color:var(--gold);background:var(--gold)}
.cname{flex:1;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.15);
  font-size:14px;padding:7px 0}
.cname:focus{border-bottom:1px solid var(--gold)}
.cprice{width:96px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.15);
  font-family:var(--serif);font-size:22px;padding:2px 0;text-align:right;font-variant-numeric:tabular-nums}
.cprice:focus{border-bottom:1px solid var(--gold)}

/* packages */
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;align-items:start}
.pkg{background:var(--bg);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.pkg.pop{border-color:rgba(176,141,87,.55)}
.pkg.on{background:#1c1813;border:1px solid var(--gold)}
.pkg-hd{display:flex;align-items:baseline;gap:10px;padding:20px 22px 0}
.pkg-name{font-size:11px;letter-spacing:.24em;color:rgba(236,231,222,.75)}
.pkg-name.pop{color:var(--gold)}
.pkg-badge{font-size:8.5px;letter-spacing:.22em;color:#161412;background:var(--gold);padding:3px 7px;font-weight:600}
.pkg-price{display:flex;justify-content:space-between;align-items:baseline;padding:8px 22px 0}
.pkg-inp{font-family:var(--serif);font-size:30px;background:transparent;border:none;
  border-bottom:1px solid transparent;padding:0;width:110px;font-variant-numeric:tabular-nums}
.pkg-inp:hover{border-bottom:1px solid rgba(255,255,255,.3)}
.pkg-inp:focus{border-bottom:1px solid var(--gold)}
.strike{font-size:13px;color:rgba(236,231,222,.4);text-decoration:line-through;font-variant-numeric:tabular-nums}
.save{font-size:9px;letter-spacing:.18em;color:var(--gold);border:1px solid rgba(176,141,87,.5);padding:3px 7px}
.permo{font-size:11px;color:rgba(236,231,222,.45);font-variant-numeric:tabular-nums}
.pkg-pick{font-size:9px;letter-spacing:.18em;padding:6px 0 0 22px;color:rgba(236,231,222,.3)}
.pkg-pick.on{color:var(--gold)}
.pkg-rule{border-bottom:1px solid rgba(176,141,87,.3);margin:14px 22px 0}
.pkg-body{padding:8px 22px 20px}
.pkg-row{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.pkg-row .nm{flex:none;font-size:12.5px;font-weight:500;line-height:1.3}
.leader{flex:1;border-bottom:1px dotted rgba(236,231,222,.25);position:relative;top:-3px}
.pkg-row .pr{font-size:12px;font-variant-numeric:tabular-nums;color:rgba(236,231,222,.8)}
.empty{margin-top:40px;padding:44px;border:1px dashed rgba(255,255,255,.18);text-align:center;
  font-size:13px;color:rgba(236,231,222,.5)}

/* summary */
.sum-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:52px;margin-top:34px;align-items:start}
.meta{display:grid;grid-template-columns:repeat(5,auto);gap:28px;justify-content:start;
  padding-bottom:18px;border-bottom:1px solid rgba(176,141,87,.35)}
.meta .k{font-size:9.5px;letter-spacing:.22em;color:rgba(236,231,222,.4)}
.meta .v{font-size:13.5px;margin-top:5px}
.sline{display:flex;gap:10px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sline .nm{font-size:14.5px;font-weight:500}
.sline .pr{font-size:14.5px;font-variant-numeric:tabular-nums}
.tot-box{border:1px solid rgba(176,141,87,.4);padding:26px 28px}
.tot-row{display:flex;justify-content:space-between;font-size:13px;color:rgba(236,231,222,.7);padding:6px 0}
.tot-row.disc{color:var(--gold)}
.tot-final{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid rgba(176,141,87,.4);margin-top:12px;padding-top:14px}
.tot-final .k{font-size:10px;letter-spacing:.24em}
.tot-final .v{font-family:var(--serif);font-size:32px;font-variant-numeric:tabular-nums}
.fineprint{font-size:11.5px;line-height:1.7;color:rgba(236,231,222,.45);margin-top:22px}

/* finance drawer */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.7);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;background:var(--panel);
  border-left:1px solid rgba(176,141,87,.4);z-index:41;padding:34px;overflow-y:auto}
.drawer h3{font-family:var(--serif);font-size:24px;font-style:italic;font-weight:400;margin:0}
.x{font-size:18px;color:rgba(236,231,222,.5);cursor:pointer;padding:4px 8px;background:none;border:none}
.x:hover{color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px}
.sbtn{width:34px;height:34px;flex:none;border:1px solid rgba(255,255,255,.22);background:none;
  color:rgba(236,231,222,.7);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.sbtn:hover{border-color:var(--gold);color:var(--gold)}
.taxinp{flex:1;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.22);
  font-size:16px;padding:8px 0;text-align:center;font-variant-numeric:tabular-nums}
.taxinp:focus{border-bottom:1px solid var(--gold)}
.termchip{font-size:10px;letter-spacing:.12em;padding:7px 11px;cursor:pointer;background:none;
  border:1px solid rgba(255,255,255,.15);color:rgba(236,231,222,.45)}
.termchip:hover{border-color:var(--gold)}
.termchip.on{border-color:var(--gold);color:var(--gold)}
.cashrow{display:flex;align-items:center;gap:12px;cursor:pointer;margin-top:4px}
.cashbox{width:18px;height:18px;flex:none;border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#161412}
.cashbox.on{border-color:var(--gold);background:var(--gold)}

/* print */
#print-sheet{display:none}
@media print{
  body{background:#fff}
  .shell,.scrim,.drawer{display:none !important}
  #print-sheet{display:block !important;background:#fff;color:#211f1c}
}
@page{size:letter;margin:.45in}
.p-bar{background:#141312;padding:16px 36px;display:flex;align-items:center;justify-content:space-between}
.p-logo-img{height:46px;display:block}
.p-meta{display:flex;justify-content:space-between;gap:24px;padding:26px 36px 0;flex-wrap:wrap}
.p-meta .k{font-size:9px;letter-spacing:.22em;color:#8a8478}
.p-meta .v{font-size:13px;margin-top:4px}
.p-sec{font-size:10px;letter-spacing:.26em;border-bottom:1px solid #211f1c;padding-bottom:8px}
.p-line{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(33,31,28,.12)}
.p-leader{flex:1;border-bottom:1px dotted rgba(33,31,28,.4);position:relative;top:-3px}
.p-tot{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:52px}
.p-rule{border-bottom:1px solid #211f1c;height:34px}
.p-cap{font-size:9.5px;letter-spacing:.22em;color:#79736a;margin-top:8px}
</style>
</head>

/* ============================ STATE ============================ */
function today(){ return new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function defaults(){
  return {
    step:0, filter:'ALL', showSettings:false,
    cName:'', cModel:'', cYear:'2026', cStock:'', cVin:'', cDate:today(),
    sel:{}, priceOv:{}, pkgOv:{}, chosenPkg:null,
    custom:{c1:{name:'',price:''},c2:{name:'',price:''}},
    taxRate:7.5, term:60, apr:7.9, cash:false
  };
}
let S = (function(){
  let saved=null;
  try{ saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); }catch(e){}
  return Object.assign(defaults(), saved||{});
})();
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }
function set(patch){ Object.assign(S,patch); save(); render(); }

/* ============================ HELPERS ============================ */
function fmt0(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function fmt2(n){ return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(v,fb){ const n=parseFloat(v); return isNaN(n)?fb:n; }
function effPrice(p){ return S.priceOv[p.id]!=null ? (parseFloat(S.priceOv[p.id])||0) : p.price; }
function customList(){
  return ['c1','c2'].map(function(k){
    const r=S.custom[k]||{name:'',price:''};
    return {id:k,brand:'CUSTOM',name:r.name||'Custom Item',price:parseFloat(r.price)||0};
  });
}
function allItems(){ return PRODUCTS.map(function(p){return Object.assign({},p,{price:effPrice(p)});}).concat(customList()); }
function tiersOf(id){ return (S.sel[id]&&S.sel[id].tiers)||{ess:true,sig:true,pre:true}; }
function selectedItems(){ return allItems().filter(function(p){ return S.sel[p.id]&&S.sel[p.id].on; }); }
function monthly(t){
  if(t<=0) return 0;
  const r=S.apr/100/12;
  return r>0 ? t*r/(1-Math.pow(1+r,-S.term)) : t/S.term;
}
function showMonthly(){ return !S.cash; }
function vehicle(){ return [S.cYear,S.cModel].filter(Boolean).join(' '); }

/* ============================ ACTIONS ============================ */
function go(step){ set({step:step}); }
function setFilter(f){ set({filter:f}); }
function toggleItem(id){
  const cur=S.sel[id], next=Object.assign({},S.sel);
  if(cur&&cur.on) next[id]=Object.assign({},cur,{on:false});
  else next[id]={on:true,tiers:(cur&&cur.tiers)||{ess:true,sig:true,pre:true}};
  set({sel:next});
}
function toggleTier(ev,id,k){
  ev.stopPropagation();
  const cur=S.sel[id]; if(!cur||!cur.on) return;
  const tiers=Object.assign({},tiersOf(id)); tiers[k]=!tiers[k];
  set({sel:Object.assign({},S.sel,{[id]:Object.assign({},cur,{tiers:tiers})})});
}
function setPrice(id,v){ const o=Object.assign({},S.priceOv); o[id]=v.replace(/[^0-9.]/g,''); set({priceOv:o}); }
function setCustom(k,fld,v){
  const c=Object.assign({},S.custom);
  c[k]=Object.assign({},c[k]||{name:'',price:''});
  c[k][fld] = fld==='price' ? v.replace(/[^0-9.]/g,'') : v;
  set({custom:c});
}
function setField(k,v){ set({[k]:v}); }
function pickPkg(k){ set({chosenPkg:S.chosenPkg===k?null:k}); }
function setPkgPrice(ev,k,v){
  ev.stopPropagation();
  const list=pkgData().find(function(p){return p.k===k;}).listTotal;
  const clean=v.replace(/[^0-9.]/g,'');
  const o=Object.assign({},S.pkgOv);
  o[k] = (clean===String(list)||clean==='') ? null : clean;
  set({pkgOv:o});
}
function toggleSettings(){ set({showSettings:!S.showSettings}); }
function stepTax(d){
  let v = Math.round((S.taxRate+d)*2)/2;
  if(v<0) v=0; if(v>15) v=15;
  set({taxRate:v});
}
function setTax(v){ set({taxRate:Math.min(15,Math.max(0,num(v,S.taxRate)))}); }
function setTerm(t){ set({term:t}); }
function setApr(v){ set({apr:num(v,S.apr)}); }
function toggleCash(){ set({cash:!S.cash}); }
function doPrint(){ window.print(); }
function resetAll(){
  if(!confirm('Clear this deal and start a new menu?')) return;
  S = defaults(); save(); render();
}

/* ============================ DERIVED ============================ */
function pkgData(){
  const sel = selectedItems();
  return TIERS.map(function(t){
    const k=t[0], label=t[1];
    const items = sel.filter(function(p){ return !!tiersOf(p.id)[k]; });
    const listTotal = items.reduce(function(a,p){return a+p.price;},0);
    const hasOv = S.pkgOv[k]!=null && S.pkgOv[k]!=='';
    const effTotal = hasOv ? (parseFloat(S.pkgOv[k])||0) : listTotal;
    return {k:k,label:label,items:items,listTotal:listTotal,effTotal:effTotal,
      discounted: hasOv && effTotal<listTotal, priceStr: hasOv?String(S.pkgOv[k]):String(listTotal)};
  });
}
function summaryData(){
  const pk = S.chosenPkg ? pkgData().find(function(p){return p.k===S.chosenPkg;}) : null;
  const items = pk ? pk.items : selectedItems();
  const itemsSum = items.reduce(function(a,p){return a+p.price;},0);
  const eff = pk ? pk.effTotal : itemsSum;
  const disc = Math.max(0, itemsSum-eff);
  const tax = eff*S.taxRate/100;
  return {pk:pk,items:items,itemsSum:itemsSum,eff:eff,disc:disc,tax:tax,total:eff+tax};
}

/* ============================ VIEWS ============================ */
function header(){
  const sel = selectedItems();
  const sub = sel.reduce(function(a,p){return a+p.price;},0);
  return ''+
  '<div class="wrap"><div class="hdr">'+
    '<img class="logo-img" src="'+LOGO+'" alt="Jenkins Genesis of Ocala">'+
    '<div class="hdr-right">'+
      '<div><div class="total-big">'+fmt0(sub)+'</div>'+
      '<div class="total-cap">SELECTED · '+sel.length+' '+(sel.length===1?'ITEM':'ITEMS')+'</div></div>'+
      '<button class="btn-ghost" onclick="toggleSettings()">FINANCE</button>'+
      '<button class="btn-ghost" onclick="resetAll()">NEW DEAL</button>'+
    '</div>'+
  '</div></div>';
}
function nav(){
  const labels=['DEAL','PRODUCTS','PACKAGES','SUMMARY'];
  const line=[vehicle(), S.cName?S.cName.toUpperCase():''].filter(Boolean).join(' · ');
  return '<div class="nav"><div class="wrap"><div class="nav-in"><div class="steps">'+
    labels.map(function(l,i){
      return '<button class="step'+(i===S.step?' on':'')+'" onclick="go('+i+')">'+l+'</button>';
    }).join('')+
    '</div><div class="veh-line">'+esc(line)+'</div></div></div></div>';
}

function viewDeal(){
  let opts='<option value="">Select model…</option>';
  Object.keys(MODELS).forEach(function(g){
    opts+='<optgroup label="'+esc(g)+'">'+MODELS[g].map(function(m){
      return '<option'+(S.cModel===m?' selected':'')+'>'+esc(m)+'</option>';
    }).join('')+'</optgroup>';
  });
  const f=function(cap,key,ph,extra){
    return '<div class="field"><div class="cap">'+cap+'</div>'+
      '<input value="'+esc(S[key])+'" placeholder="'+esc(ph||'')+'" '+(extra||'')+
      ' onchange="setField(\''+key+'\',this.value)"></div>';
  };
  return '<div class="wrap pane">'+
    '<h2 class="title">Deal Information</h2>'+
    '<div class="sub">Who we’re building this menu for.</div>'+
    '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:34px 40px;margin-top:40px;max-width:900px">'+
      f('CUSTOMER NAME','cName','Full name')+
      '<div class="field"><div class="cap">VEHICLE MODEL</div>'+
        '<select onchange="setField(\'cModel\',this.value)">'+opts+'</select></div>'+
      f('YEAR','cYear','2026')+
      f('STOCK #','cStock','—')+
      f('VIN (LAST 8)','cVin','—')+
      f('DATE','cDate','')+
    '</div>'+
    '<div style="display:flex;justify-content:flex-end;margin-top:56px">'+
      '<button class="btn-gold" onclick="go(1)">SELECT PRODUCTS &nbsp;›</button></div>'+
  '</div>';
}

function tierChips(id){
  if(!(S.sel[id]&&S.sel[id].on)) return '';
  const t=tiersOf(id);
  return '<div class="chips">'+TIERS.map(function(x){
    return '<button class="chip'+(t[x[0]]?' on':'')+'" onclick="toggleTier(event,\''+id+'\',\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('')+'</div>';
}
function viewProducts(){
  const shown = PRODUCTS.filter(function(p){ return S.filter==='ALL'||p.brand===S.filter; });
  const cards = shown.map(function(p){
    const on = !!(S.sel[p.id]&&S.sel[p.id].on);
    const pv = S.priceOv[p.id]!=null?S.priceOv[p.id]:p.price;
    return '<div class="card" onclick="toggleItem(\''+p.id+'\')">'+
      '<div class="chk'+(on?' on':'')+'">'+(on?'✓':'')+'</div>'+
      '<div class="brandtag'+(p.brand==='XPEL'?' xpel':'')+'">'+p.brand+'</div>'+
      '<div class="pname">'+esc(p.name)+'</div>'+
      '<div class="pdesc">'+esc(p.desc)+'</div>'+
      '<div class="pricerow"><div class="dollar">$</div>'+
        '<input class="pinput" inputmode="decimal" value="'+esc(pv)+'" onclick="event.stopPropagation()" '+
        'onchange="setPrice(\''+p.id+'\',this.value)"></div>'+
      '<div class="warr">'+esc(p.warranty)+'</div>'+
      tierChips(p.id)+
    '</div>';
  }).join('');

  const rows = ['c1','c2'].map(function(k){
    const on=!!(S.sel[k]&&S.sel[k].on), r=S.custom[k]||{name:'',price:''};
    return '<div class="crow">'+
      '<div class="cbox'+(on?' on':'')+'" onclick="toggleItem(\''+k+'\')">'+(on?'✓':'')+'</div>'+
      '<input class="cname" value="'+esc(r.name)+'" placeholder="Describe item — e.g. windshield treatment, detail package…" '+
        'onchange="setCustom(\''+k+'\',\'name\',this.value)">'+
      '<div style="display:flex;align-items:baseline;gap:4px"><div class="dollar" style="font-size:15px">$</div>'+
        '<input class="cprice" inputmode="decimal" placeholder="0" value="'+esc(r.price)+'" '+
        'onchange="setCustom(\''+k+'\',\'price\',this.value)"></div>'+
      tierChips(k)+
    '</div>';
  }).join('');

  const sel=selectedItems();
  const sub=sel.reduce(function(a,p){return a+p.price;},0);
  const filters=[['ALL','ALL'],['XPEL','XPEL PROTECTION'],['GENESIS','GENESIS ACCESSORIES']].map(function(f){
    return '<button class="filt'+(S.filter===f[0]?' on':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+'</button>';
  }).join('');

  return '<div class="wrap pane">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-end">'+
      '<div><h2 class="title">Protection &amp; Accessories</h2>'+
      '<div class="sub" style="max-width:520px">Curated for your '+esc(vehicle()||'Genesis')+
      '. Select individually, or build packages on the next step.</div></div>'+
      '<div class="filters">'+filters+'</div>'+
    '</div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="custom-hd"><div class="cap">CUSTOM ITEMS</div>'+
      '<div style="font-size:10px;letter-spacing:.14em;color:rgba(236,231,222,.3)">'+
      'PRICES ON ANY CARD CAN BE TAPPED &amp; ADJUSTED</div></div>'+
    rows+
    '<div class="row-end">'+
      '<button class="btn-back" onclick="go(0)">‹ &nbsp;DEAL INFO</button>'+
      '<div style="display:flex;align-items:center;gap:28px">'+
        '<div style="font-size:12.5px;color:rgba(236,231,222,.6)">'+
        (sel.length? sel.length+(sel.length===1?' item · ':' items · ')+fmt0(sub) : 'No items selected')+'</div>'+
        '<button class="btn-gold" onclick="go(2)">BUILD PACKAGES &nbsp;›</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function viewPackages(){
  const pkgs=pkgData();
  const anySel = selectedItems().length>0;
  let body;
  if(!anySel){
    body='<div class="empty">No items selected yet — go back to Products to add items.</div>';
  } else {
    body='<div class="pkgs">'+pkgs.map(function(p){
      const chosen=S.chosenPkg===p.k;
      const withTax=p.effTotal*(1+S.taxRate/100);
      return '<div class="pkg'+(p.k==='sig'?' pop':'')+(chosen?' on':'')+'" onclick="pickPkg(\''+p.k+'\')">'+
        '<div class="pkg-hd"><div class="pkg-name'+(p.k==='sig'?' pop':'')+'">'+p.label+'</div>'+
          (p.k==='sig'?'<div class="pkg-badge">MOST POPULAR</div>':'')+'</div>'+
        '<div class="pkg-price"><div style="display:flex;align-items:baseline;gap:10px">'+
          '<div style="display:flex;align-items:baseline;gap:3px"><div class="dollar" style="font-size:18px">$</div>'+
          '<input class="pkg-inp" inputmode="decimal" value="'+esc(p.priceStr)+'" onclick="event.stopPropagation()" '+
          'onchange="setPkgPrice(event,\''+p.k+'\',this.value)"></div>'+
          (p.discounted?'<div class="strike">'+fmt0(p.listTotal)+'</div>':'')+
          (p.discounted?'<div class="save">SAVE '+fmt0(p.listTotal-p.effTotal)+'</div>':'')+
        '</div>'+
        '<div class="permo">'+(showMonthly()&&p.effTotal>0?'+'+fmt0(monthly(withTax))+' / mo':'')+'</div></div>'+
        '<div class="pkg-pick'+(chosen?' on':'')+'">'+(chosen?'✓ SELECTED FOR SUMMARY':'TAP TO SELECT')+'</div>'+
        '<div class="pkg-rule"></div>'+
        '<div class="pkg-body">'+p.items.map(function(it){
          return '<div class="pkg-row"><div class="nm">'+esc(it.name)+'</div><div class="leader"></div>'+
            '<div class="pr">'+fmt0(it.price)+'</div></div>';
        }).join('')+'</div>'+
      '</div>';
    }).join('')+'</div>'+
    '<div style="margin-top:18px;font-size:11.5px;color:rgba(236,231,222,.4)">Tap a package to select it — the Summary and printed menu will show that package’s products and price. The Essential / Signature / Prestige toggles on the Products page control what’s in each.</div>';
  }
  return '<div class="wrap pane">'+
    '<h2 class="title">Build Packages</h2>'+
    '<div class="sub">Three ways to say yes — built automatically from your product selections.</div>'+
    body+
    '<div class="row-end">'+
      '<button class="btn-back" onclick="go(1)">‹ &nbsp;PRODUCTS</button>'+
      '<button class="btn-gold" onclick="go(3)">REVIEW &amp; SIGN &nbsp;›</button>'+
    '</div>'+
  '</div>';
}

function viewSummary(){
  const d=summaryData();
  const meta=[['CUSTOMER',S.cName||'—'],['VEHICLE',vehicle()||'—'],['STOCK',S.cStock||'—'],
    ['VIN (LAST 8)',S.cVin||'—'],['DATE',S.cDate||'—']].map(function(m){
    return '<div><div class="k">'+m[0]+'</div><div class="v">'+esc(m[1])+'</div></div>';
  }).join('');
  const lines = d.items.length ? d.items.map(function(it){
    return '<div class="sline"><div class="nm">'+esc(it.name)+'</div><div class="leader"></div>'+
      '<div class="pr">'+fmt0(it.price)+'</div></div>';
  }).join('') : '<div class="empty" style="margin-top:24px">No items selected — go to Products to add items.</div>';

  return '<div class="wrap pane">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-end">'+
      '<div><h2 class="title">Review &amp; Sign</h2><div class="sub">'+
        (d.pk ? TIER_NAMES[d.pk.k]+' Package selected — confirm below, then print for signatures.'
              : 'Confirm the selections below, then print for signatures. Tip: tap a package on the Packages page to summarize that package instead.')+
      '</div></div>'+
      '<button class="btn-gold" onclick="doPrint()">PRINT MENU &nbsp;⎙</button>'+
    '</div>'+
    '<div class="sum-grid">'+
      '<div><div class="meta">'+meta+'</div>'+lines+'</div>'+
      '<div><div class="tot-box">'+
        '<div class="tot-row"><div>Subtotal</div><div>'+fmt2(d.itemsSum)+'</div></div>'+
        (d.disc>0?'<div class="tot-row disc"><div>Package Discount</div><div>−'+fmt2(d.disc)+'</div></div>':'')+
        '<div class="tot-row"><div>Sales Tax ('+S.taxRate.toFixed(1)+'%)</div><div>'+fmt2(d.tax)+'</div></div>'+
        '<div class="tot-final"><div class="k">TOTAL</div><div class="v">'+fmt2(d.total)+'</div></div>'+
        (showMonthly()?'<div class="tot-row" style="margin-top:8px"><div>Monthly Payment Est. ('+S.term+' mo)</div><div>'+
          fmt0(monthly(d.total))+' / mo</div></div>':'')+
      '</div>'+
      '<div class="fineprint">All prices pre-tax; tax reflected in total. Monthly estimates are illustrative, based on Finance settings. XPEL products carry the XPEL manufacturer warranty; genuine accessories carry the Genesis Accessory Limited Warranty. Signatures are collected on the printed menu.</div>'+
      '</div>'+
    '</div>'+
    '<div class="row-end"><button class="btn-back" onclick="go(2)">‹ &nbsp;PACKAGES</button><div></div></div>'+
  '</div>';
}

function viewDrawer(){
  if(!S.showSettings) return '';
  const chips=[24,36,48,60,72,84].map(function(t){
    return '<button class="termchip'+(t===S.term?' on':'')+'" onclick="setTerm('+t+')">'+t+' MO</button>';
  }).join('');
  return '<div class="scrim" onclick="toggleSettings()"></div>'+
  '<div class="drawer">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<h3>Finance Settings</h3><button class="x" onclick="toggleSettings()">×</button></div>'+
    '<div style="margin-top:32px;display:flex;flex-direction:column;gap:28px">'+
      '<div class="field"><div class="cap">SALES TAX RATE (%)</div>'+
        '<div class="stepper">'+
          '<button class="sbtn" onclick="stepTax(-0.5)">−</button>'+
          '<input class="taxinp" inputmode="decimal" value="'+S.taxRate.toFixed(1)+'" onchange="setTax(this.value)">'+
          '<button class="sbtn" onclick="stepTax(0.5)">+</button>'+
        '</div>'+
        '<div style="font-size:10.5px;color:rgba(236,231,222,.35);letter-spacing:.06em">Steps by 0.5% — Marion 7.5, Alachua 7.0, Lake 7.0, Citrus 6.5</div>'+
      '</div>'+
      '<div class="field"><div class="cap">FINANCE TERM</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:6px">'+chips+'</div></div>'+
      '<div class="field"><div class="cap">INTEREST RATE (% APR)</div>'+
        '<input value="'+S.apr+'" inputmode="decimal" onchange="setApr(this.value)"></div>'+
      '<div class="cashrow" onclick="toggleCash()">'+
        '<div class="cashbox'+(S.cash?' on':'')+'">'+(S.cash?'✓':'')+'</div>'+
        '<div style="font-size:13px;color:rgba(236,231,222,.75)">Cash deal — hide monthly estimate</div></div>'+
    '</div>'+
  '</div>';
}

function viewPrint(){
  const d=summaryData();
  const meta=[['CUSTOMER',S.cName||'—'],['VEHICLE',vehicle()||'—'],['STOCK',S.cStock||'—'],
    ['VIN (LAST 8)',S.cVin||'—'],['DATE',S.cDate||'—']].map(function(m){
    return '<div><div class="k">'+m[0]+'</div><div class="v">'+esc(m[1])+'</div></div>';
  }).join('');
  return ''+
  '<div class="p-bar"><img class="p-logo-img" src="'+LOGO+'" alt="Jenkins Genesis of Ocala">'+
    '<div style="font-size:9.5px;letter-spacing:.26em;color:rgba(236,231,222,.7)">ACCESSORY &amp; PROTECTION MENU</div></div>'+
  '<div class="p-meta">'+meta+'</div>'+
  '<div style="padding:22px 36px 0">'+
    '<div class="p-sec">'+(d.pk?'SELECTED PRODUCTS · '+TIER_NAMES[d.pk.k].toUpperCase()+' PACKAGE':'SELECTED PRODUCTS')+'</div>'+
    d.items.map(function(it){
      return '<div class="p-line"><div style="font-size:13px;font-weight:500">'+esc(it.name)+'</div>'+
        '<div style="font-size:11px;color:#79736a">'+esc(it.brand)+'</div>'+
        '<div class="p-leader"></div><div style="font-size:13px;font-variant-numeric:tabular-nums">'+fmt0(it.price)+'</div></div>';
    }).join('')+
  '</div>'+
  '<div style="display:flex;justify-content:flex-end;padding:18px 36px 0"><div style="width:300px">'+
    '<div class="p-tot"><div>Subtotal</div><div>'+fmt2(d.itemsSum)+'</div></div>'+
    (d.disc>0?'<div class="p-tot" style="color:#A67F45"><div>Package Discount</div><div>−'+fmt2(d.disc)+'</div></div>':'')+
    '<div class="p-tot"><div>Sales Tax ('+S.taxRate.toFixed(1)+'%)</div><div>'+fmt2(d.tax)+'</div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #211f1c;margin-top:8px;padding-top:10px">'+
      '<div style="font-size:10px;letter-spacing:.22em">TOTAL</div>'+
      '<div style="font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums">'+fmt2(d.total)+'</div></div>'+
    (showMonthly()?'<div class="p-tot" style="color:#79736a;font-size:11px"><div>Monthly Payment Est. ('+S.term+' mo)</div><div>'+
      fmt0(monthly(d.total))+' / mo</div></div>':'')+
  '</div></div>'+
  '<div style="padding:26px 36px 0">'+
    '<div class="p-sec">CUSTOMER ACKNOWLEDGMENT</div>'+
    '<div style="font-size:11px;line-height:1.7;color:#4a463f;margin-top:12px">I have been presented with the above accessory and protection products by the dealership. The items selected have been agreed to at the prices listed. I understand all products are optional and my selections are reflected by my signature below.</div>'+
    '<div class="p-sign">'+
      '<div><div class="p-rule"></div><div class="p-cap">CUSTOMER SIGNATURE &nbsp;·&nbsp; DATE</div></div>'+
      '<div><div class="p-rule"></div><div class="p-cap">SALES ASSOCIATE &nbsp;·&nbsp; DATE</div></div>'+
    '</div>'+
    '<div style="font-size:9.5px;line-height:1.7;color:#8a8478;margin-top:34px">All prices shown are pre-tax; sales tax is applied and reflected in the total above. Monthly payment estimates are illustrative only. XPEL products carry the XPEL manufacturer warranty. Genuine Genesis accessories carry the Genesis Accessory Limited Warranty. Products and prices are subject to change without notice. '+esc(STORE)+'.</div>'+
  '</div>';
}

/* ============================ RENDER ============================ */
function render(){
  const views=[viewDeal,viewProducts,viewPackages,viewSummary];
  document.getElementById('app').innerHTML = header()+nav()+(views[S.step]||viewDeal)();
  document.getElementById('drawer-host').innerHTML = viewDrawer();
  document.getElementById('print-sheet').innerHTML = viewPrint();
}
render();
</script>
</body>
</html>
